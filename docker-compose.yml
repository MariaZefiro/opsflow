services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsflow}
      POSTGRES_USER: ${POSTGRES_USER:-opsflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsflow}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - opsflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['npm', 'exec', '--workspace', '@opsflow/api', '--', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsflow}:${POSTGRES_PASSWORD:-opsflow}@postgres:5432/${POSTGRES_DB:-opsflow}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['npm', '--workspace', '@opsflow/api', 'run', 'prisma:seed']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsflow}:${POSTGRES_PASSWORD:-opsflow}@postgres:5432/${POSTGRES_DB:-opsflow}?schema=public
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@opsflow.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-OpsFlowDemo2026!}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-opsflow}:${POSTGRES_PASSWORD:-opsflow}@postgres:5432/${POSTGRES_DB:-opsflow}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-me}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173,http://localhost:8080}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-3000}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  opsflow-postgres:
